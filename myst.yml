# -----------------------------------------------------------------
# 1️⃣  Core Book metadata
# -----------------------------------------------------------------
version: 1                                   # ← required

project:
  title: "TMA4400 – Matematikk 1 Kalkulus og lineær algebra"
  # logo file must exist in the repository root (or give a relative path)
  logo: "logo.png"
  # “authors” is a list – you can keep a single string if you prefer,
  # but a list is the canonical form.
  authors:
    - "Yael Fleischmann"
    - "Markus Arthur Köbis"
    - "Jørgen Endal Letnes"
    - "Morten Andreas Nome"
    - "Gereon Quick"
    - "Frode Rønning"
  email: "jorgen.endal@ntnu.no"
  copyright: "2026"
  description: >-
    Interaktivt kursmateriell i kalkulus og lineær algebra.
    (Fyll inn en lengre beskrivelse om du ønsker.)

# -----------------------------------------------------------------
# 2️⃣  Site‑wide appearance, repository links, launch buttons etc.
# -----------------------------------------------------------------
site:
  # ── Theme (maps to the old “html_theme” + “html_theme_options”)
  theme:
    name: "sphinx_book_theme"
    options:
      logo_text: "TMA4400"
      repository_url: "https://github.com/imfdrift/TMA4400_Calc_LinAlg_Notes"
      use_repository_button: true
      # launch buttons live under the same options dict
      launch_buttons:
        notebook_interface: "jupyterlab"
        jupyterhub_url: "https://tma4400.apps.stack.it.ntnu.no/"
        binderhub_url: "https://mybinder.org"
        colab_url: "https://colab.research.google.com"
        thebe: true

  # ── Repository information (used for “Edit this page”, “View source”, etc.)
  repository:
    url: "https://github.com/imfdrift/TMA4400_Calc_LinAlg_Notes"
    path_to_book: "."               # repo‑root holds the book
    branch: "main"

  # ── Optional extra HTML that appears in the top‑right corner of every page
  extra-navbar: |
    <a href="https://github.com/imfdrift/TMA4400_Calc_LinAlg_Notes">
      <img src="https://img.shields.io/github/stars/imfdrift/TMA4400_Calc_LinAlg_Notes?style=social"
           alt="GitHub stars">
    </a>

  # ── Buttons that appear at the bottom of each page (previously
  #     `html.use_issues_button`, `html.use_repository_button`, etc.)
  html:
    use_issues_button: true
    use_repository_button: true
    use_edit_page_button: true

# -----------------------------------------------------------------
# 3️⃣  MyST parser extensions (formerly “parse.myst_enable_extensions”)
# -----------------------------------------------------------------
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    # - html_admonition      # ← disabled, but keep the comment if you may enable later
    - html_image
    - linkify
    # - replacements
    # - smartquotes
    - substitution
    - tasklist

# -----------------------------------------------------------------
# 4️⃣  Notebook execution policy (was “execute”)
# -----------------------------------------------------------------
execute:
  execute_notebooks: "force"   # always re‑run notebooks on each build

# -----------------------------------------------------------------
# 5️⃣  Sphinx‑specific extensions and configuration
# -----------------------------------------------------------------
sphinx:
  # “extra_extensions” in the old config maps to “extensions” here
  extensions:
    - sphinx_togglebutton
    - sphinx_copybutton
    - sphinx_proof
    - sphinx_exercise
  config:
    hide_solutions: false
    bibtex_reference_style: "author_year"
    myst_dmath_double_inline: true

    # LaTeX customisation (still used when you later build a PDF)
    latex_elements:
      preamble: |
        \usepackage{amsmath}
        \usepackage[nice]{nicefrac}
        \usepackage{notation}
        \usepackage{mathtools}
    latex_additional_files: ["notation.sty"]

    # MathJax configuration – identical to what you had before
    mathjax_path: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    mathjax3_config:
      tex:
        macros:
          RR: ["\\mathbb{R}"]
          NN: ["\\mathbb{N}"]
          VV: ["\\mathbb{V}"]
          CC: ["\\mathbb{C}"]
          PP: ["\\mathbb{P}"]
          PPc: ["\\mathbb{P}^{\\mathrm{c}}"]
          PPdc: ["\\mathbb{P}^{\\mathrm{dc}}"]
          floor: ["\\lfloor#1\\rfloor", 1]
          mrm: ["\\mathrm{#1}", 1]
          mcA: ["\\mathcal{A}"]
          mcL: ["\\mathcal{L}"]
          mcT: ["\\mathcal{T}"]
          mcF: ["\\mathcal{F}"]
          mcP: ["\\mathcal{P}"]
          mcO: ["\\mathcal{O}"]
          cd: ["\\mathrm{cd}"]
          onehalf: ["\\frac{1}{2}"]
          bfa: ["\\mathbf{a}"]
          bfb: ["\\mathbf{b}"]
          bfe: ["\\mathbf{e}"]
          bff: ["\\mathbf{f}"]
          bfg: ["\\mathbf{g}"]
          bfj: ["\\mathbf{j}"]
          bfn: ["\\mathbf{n}"]
          bfp: ["\\mathbf{p}"]
          bft: ["\\mathbf{t}"]
          bfu: ["\\mathbf{u}"]
          bfv: ["\\mathbf{v}"]
          bfx: ["\\mathbf{x}"]
          bfy: ["\\mathbf{y}"]
          bfB: ["\\mathbf{B}"]
          bfV: ["\\mathbf{V}"]
          bfE: ["\\mathbf{E}"]
          bfK: ["\\mathbf{K}"]
          dx: ["\\,\\mathrm{d}x"]
          dy: ["\\,\\mathrm{d}y"]
          ds: ["\\,\\mathrm{d}s"]
          dt: ["\\,\\mathrm{d}t"]
          dS: ["\\,\\mathrm{d}S"]
          dV: ["\\,\\mathrm{d}V"]
          dX: ["\\,\\mathrm{d}X"]
          dY: ["\\,\\mathrm{d}Y"]
          dE: ["\\,\\mathrm{d}E"]
          dK: ["\\,\\mathrm{d}K"]
          dM: ["\\,\\mathrm{d}M"]
          dU: ["\\,\\mathrm{d}U"]
          dGamma: ["\\,\\mathrm{d}\\Gamma"]
          spann: ["\\mathrm{span}"]
          diam: ["\\mathrm{diam}"]
          convex: ["\\mathrm{convex}"]
          avg: ["\\{\\!\\!\\{ #1 \\}\\!\\!\\}", 1]
          wavg: ["\\{\\!\\!\\{ #1 \\}\\!\\!\\}_{\\omega}", 1]
          wavgd: ["\\langle\\!\\langle#1\\rangle\\!\\rangle_{\\omega}", 1]
          jump: ["[\\![#1]\\!]", 1]
          jumps: ["[#1]]", 1]
          avgs: ["\\{#1\\}", 1]
          st: ["\\;|\\;"]

# -----------------------------------------------------------------
# 6️⃣  Bibliography files (was “bibliography”)
# -----------------------------------------------------------------
bibliography:
  - "TMA4400.bib"

# -----------------------------------------------------------------
# 7️⃣  Files / directories that should be ignored when building
# -----------------------------------------------------------------
exclude:
  - "_build"
  - "sandbox"
  - "Thumbs.db"
  - ".DS_Store"
  - "**.ipynb_checkpoints"

# -----------------------------------------------------------------
# 8️⃣  Table‑of‑Contents (replaces the old “toc” block)
# -----------------------------------------------------------------
table-of-contents:
  format: myst
  root: "README"                     # file without “.md” suffix
  sections:
    - file: "README"
    - file: "chapter_GaussElimi/Gauss-eliminasjon"
#   Uncomment and add more sections when you are ready:
